<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jack Account</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" />
<style>
  :root {
    color-scheme: dark;
    --bg:#0b0c0e; --panel:#101216; --panel2:#0d0f12;
    --line:#23272f; --line2:#363c47; --fg:#e7e9ee; --dim:#848b99;
    --accent:#f2663c; --ok:#5ec98a;
    --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100dvh; font-family: var(--mono); color: var(--fg); font-size: 14px;
    background: var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,.015) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.015) 1px, transparent 1px);
    background-size: 22px 22px;
    display: grid; place-items: center; padding: 22px;
  }
  .card {
    width: min(410px, 100%); background: var(--panel); border: 1px solid var(--line2);
    border-radius: 8px; padding: 20px 18px 16px; box-shadow: 0 0 0 4px rgba(0,0,0,.25);
  }
  /* terminal title bar */
  .titlebar { display: flex; align-items: center; gap: 7px; padding-bottom: 14px; margin-bottom: 4px; border-bottom: 1px solid var(--line); color: var(--dim); font-size: 11px; letter-spacing: .5px; }
  .titlebar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--line2); }
  .titlebar .dot.a { background: var(--accent); }
  .brand { display: flex; align-items: center; gap: 12px; margin-top: 16px; }
  .brand .head { width: 40px; height: 40px; image-rendering: pixelated; background: url("./icons/dude.png") center/contain no-repeat; }
  h1 { font-size: 18px; margin: 0; letter-spacing: .5px; }
  p.sub { margin: 10px 0 18px; color: var(--dim); font-size: 12.5px; line-height: 1.55; }
  label { display: block; font-size: 11px; color: var(--dim); margin: 14px 0 0; text-transform: uppercase; letter-spacing: .7px; }
  input {
    width: 100%; padding: 11px 12px; border-radius: 4px; font-size: 16px; margin-top: 6px;
    background: var(--panel2); border: 1px solid var(--line2); color: var(--fg); outline: none; font-family: var(--mono);
  }
  input::placeholder { color: #5a606d; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  button {
    width: 100%; margin-top: 18px; padding: 12px; border: 0; border-radius: 4px; cursor: pointer;
    font-size: 14px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #0b0c0e; background: var(--accent); font-family: var(--mono);
  }
  button.primary::before { content: "[ "; } button.primary::after { content: " ]"; }
  button.ghost { background: transparent; color: var(--fg); border: 1px solid var(--line2); text-transform: lowercase; letter-spacing: 0; font-weight: 500; }
  button:active { transform: translateY(1px); }
  .row { display: flex; gap: 10px; }
  .row button { margin-top: 10px; }
  .msg { min-height: 18px; margin-top: 12px; font-size: 12px; color: #ff8a7a; text-align: center; }
  .msg.ok { color: var(--ok); }
  .muted { color: var(--dim); font-size: 11.5px; text-align: center; margin-top: 14px; }
  .muted::before { content: "// "; color: var(--accent); }
  a { color: var(--accent); }
  .signed { text-align: center; }
  .head-big { width: 56px; height: 56px; image-rendering: pixelated; margin: 8px auto 10px; background: url("./icons/dude.png") center/contain no-repeat; }
  .apps { display: grid; gap: 8px; margin-top: 16px; text-align: left; }
  .apps a { display: flex; justify-content: space-between; padding: 11px 12px; border-radius: 4px; background: var(--panel2); border: 1px solid var(--line2); text-decoration: none; color: var(--fg); font-size: 13px; }
  .apps a:hover { border-color: var(--accent); }
  .apps a span { color: var(--accent); }
  .hidden { display: none; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0 6px; }
  .who { font-size: 16px; margin: 0; }
  .whoSub { color: var(--dim); font-size: 12px; margin: 4px 0 0; }
</style>
</head>
<body>
  <div class="card">
    <div class="titlebar"><span class="dot a"></span><span class="dot"></span><span class="dot"></span><span>jack@account — ~/</span></div>

    <!-- Auth -->
    <div id="authView">
      <div class="brand"><div class="head"></div><h1>jack account</h1></div>
      <p class="sub">one account for everything jack builds.</p>

      <label id="identLabel">username or email</label>
      <input id="ident" autocomplete="username" placeholder="jack" />
      <label>password</label>
      <input id="pass" type="password" autocomplete="current-password" placeholder="••••••••" />
      <input id="displayName" class="hidden" placeholder="display name (optional)" />
      <button id="primaryBtn" class="primary">Sign in</button>
      <div class="row">
        <button id="googleBtn" class="ghost">google</button>
        <button id="toggleBtn" class="ghost">create account</button>
      </div>
      <div class="msg" id="msg"></div>
      <div class="muted">firebase not set up? see the repo readme.</div>
    </div>

    <!-- Signed in -->
    <div id="homeView" class="hidden signed">
      <div class="head-big"></div>
      <h1 class="who" id="who">—</h1>
      <p class="whoSub" id="whoSub">signed in</p>
      <div class="apps">
        <a href="/dude-mobile/">dude mobile <span>→</span></a>
        <a href="/ping/">ping <span>→</span></a>
        <a href="/cribs/">cribs <span>→</span></a>
      </div>
      <hr/>
      <button class="ghost" id="signOutBtn">sign out</button>
    </div>
  </div>

<script type="module">
  import { JackAccount } from "./js/jackaccount.js";
  const $ = (id) => document.getElementById(id);
  let mode = "signin";
  function setMsg(t, ok=false){ const m=$("msg"); m.textContent=t||""; m.className="msg"+(ok?" ok":""); }
  function renderMode() {
    $("primaryBtn").textContent = mode === "signin" ? "Sign in" : "Create account";
    $("toggleBtn").textContent  = mode === "signin" ? "create account" : "have an account?";
    $("displayName").classList.toggle("hidden", mode !== "signup");
    setMsg("");
  }
  $("toggleBtn").onclick = () => { mode = mode === "signin" ? "signup" : "signin"; renderMode(); };
  $("primaryBtn").onclick = async () => {
    const id = $("ident").value.trim(), pw = $("pass").value;
    if (!id || !pw) return setMsg("enter a username/email and password.");
    try {
      setMsg(mode === "signin" ? "signing in…" : "creating account…", true);
      if (mode === "signin") await JackAccount.signIn(id, pw);
      else await JackAccount.signUp(id, pw, $("displayName").value.trim());
    } catch (e) { setMsg(humanize(e)); }
  };
  $("googleBtn").onclick = async () => {
    try { setMsg("opening google…", true); await JackAccount.signInWithGoogle(); }
    catch (e) { setMsg(humanize(e)); }
  };
  $("signOutBtn").onclick = () => JackAccount.signOut();
  JackAccount.onAuthState((user) => {
    if (user) {
      $("authView").classList.add("hidden");
      $("homeView").classList.remove("hidden");
      $("who").textContent = (user.displayName || "jack").toLowerCase();
      $("whoSub").textContent = user.email?.endsWith("jack.id") ? "@" + user.email.split("@")[0] : (user.email || "signed in");
    } else {
      $("homeView").classList.add("hidden");
      $("authView").classList.remove("hidden");
    }
  });
  function humanize(e){
    const c = (e && e.code) || "";
    if (c.includes("invalid-credential") || c.includes("wrong-password")) return "wrong username or password.";
    if (c.includes("email-already-in-use")) return "that account already exists — sign in instead.";
    if (c.includes("weak-password")) return "password needs 6+ characters.";
    if (c.includes("api-key-not-valid") || c.includes("configuration")) return "firebase not configured yet — see readme.";
    if (c.includes("popup-closed")) return "google sign-in was cancelled.";
    return (e && e.message) ? e.message.replace("Firebase: ", "") : "something went wrong.";
  }
  renderMode();
</script>
</body>
</html>
